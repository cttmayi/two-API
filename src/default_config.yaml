# two-API 配置文件
# 首次启动自动生成，编辑后重启生效。
# 也可在浏览器中访问 /settings 通过 Web 页面配置。

server:
  host: "0.0.0.0"
  port: 8080

# 模型配置（至少添加一个模型才能转发请求）
# models:
#   - names:
#       - gpt-4o
#     openai_base_url: https://api.openai.com/v1
#     api_key: sk-your-openai-key
#
#   - names:
#       - claude-sonnet-4-6
#     anthropic_base_url: https://api.anthropic.com/v1
#     api_key: sk-ant-your-anthropic-key
#     max_tokens: 8192
#
# 可选功能：
#   alias:  全局别名，请求中 model 先查此映射
#   cache:  响应缓存，减少重复请求延迟
#   logging: 日志级别和输出目录
